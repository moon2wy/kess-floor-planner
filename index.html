<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="KESS 2층 가구 배치를 편집하고 간격을 재는 도구">
  <title>KESS 사무실 배치 편집기</title>
  <style>:root {
  color-scheme: light;
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  background: #edf1f6;
  color: #192b42;
  --ink: #192b42;
  --muted: #536378;
  --line: #dce4ee;
  --blue: #285da4;
  --blue-soft: #e8f0ff;
  --green: #387b49;
  --danger: #a32d30;
}

*, *::before, *::after { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body { margin: 0; }
[hidden] { display: none !important; }
button, output { font: inherit; }
button {
  min-height: 40px;
  padding: 8px 13px;
  border: 1px solid #d7e0ea;
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  font-size: 14px;
  font-weight: 650;
  white-space: nowrap;
  cursor: pointer;
}
button:hover:not(:disabled) { background: #f0f5fe; border-color: #b1c6e3; }
button:focus-visible { outline: 2px solid #1f66be; outline-offset: 2px; }
button:disabled { color: #697987; opacity: .55; cursor: default; }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
button.primary:hover:not(:disabled) { background: #1c4d90; border-color: #1c4d90; }

.topbar {
  min-height: 86px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px 24px;
  padding: 16px clamp(14px, 2.7vw, 42px);
  color: #fff;
  background: #172f50;
  border-bottom: 3px solid #4574ac;
}
.identity, .file-actions, .toolbar, .history, .segmented, .panel-header, .object-actions, .zoom {
  display: flex;
  align-items: center;
}
.identity { gap: 14px; }
.brand {
  display: grid;
  place-items: center;
  width: 61px;
  height: 46px;
  border: 1px solid #7596bd;
  border-radius: 10px;
  color: #f3f7ff;
  font-family: system-ui, sans-serif;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: .05em;
  background: #254976;
}
h1 { margin: 0; font-size: clamp(20px, 2.2vw, 28px); font-weight: 750; letter-spacing: -.045em; }
.save-status { margin: 5px 0 0; color: #d7e5f8; font-size: 14px; }
.file-actions { gap: 8px; flex-wrap: wrap; }
.file-actions button:not(.primary) { background: #224065; border-color: #6c8bb2; color: #fff; }
.file-actions button:not(.primary):hover { background: #2c507d; }
.file-actions .primary { background: #fff; border-color: #fff; color: #174476; }
.file-actions .primary:hover:not(:disabled) { background: #e5f0ff; border-color: #e5f0ff; }

.workspace {
  max-width: 1650px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 312px;
  gap: 16px;
  margin: 0 auto;
  padding: 16px clamp(12px, 2.5vw, 36px) 20px;
}
.board, .panel { background: white; border: 1px solid var(--line); border-radius: 13px; }
.board { min-width: 0; overflow: hidden; }
.toolbar { min-height: 62px; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.segmented { gap: 4px; background: #edf2f8; border-radius: 9px; padding: 4px; }
.segmented button { border: 0; min-height: 34px; padding: 5px 11px; background: transparent; color: var(--muted); }
.segmented button[aria-pressed="true"] { color: #204e8b; background: #fff; box-shadow: 0 1px 3px #193c6825; }
.plan-switch button {
  display: grid;
  place-items: center;
  min-width: 42px;
  min-height: 34px;
  padding: 5px 8px;
  border-radius: 7px;
  color: var(--muted);
  background: transparent;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
}
.plan-switch button:hover { background: #e1eafa; }
.plan-switch button:focus-visible { outline: 2px solid #1f66be; outline-offset: 2px; }
.plan-switch button[aria-pressed="true"] { color: white; background: var(--blue); }
#erase-mode { display: inline-flex; align-items: center; gap: 6px; }
.eraser-icon { width: 13px; height: 9px; border: 1.5px solid currentColor; border-radius: 2px; transform: rotate(-40deg); background: linear-gradient(90deg, transparent 47%, currentColor 47%, currentColor 56%, transparent 56%); }
.history { gap: 6px; flex-wrap: wrap; }
.history button { min-height: 35px; }
.history #undo, .history #redo { min-width: 38px; padding: 1px 7px; font-size: 21px; line-height: 1; }
.viewport {
  position: relative;
  height: clamp(490px, calc(100svh - 213px), 1050px);
  overflow: hidden;
  overflow: clip;
  touch-action: none;
  background-color: #e9eff5;
  background-image: radial-gradient(#b7c8d8 1px, transparent 1px);
  background-size: 15px 15px;
  overscroll-behavior: contain;
}
#scene { display: block; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; }
#scene .furniture { cursor: grab; }
#scene .furniture:focus { outline: none; }
#scene .furniture:focus-visible > .object-outline { stroke: #365dcb; stroke-width: 30; stroke-dasharray: 45 24; }
.viewport[data-mode="measure"] #scene, .viewport[data-mode="measure"] #scene * { cursor: crosshair; }
.viewport[data-mode="erase"] #scene { cursor: crosshair; }
.viewport[data-mode="erase"] #scene .furniture { cursor: inherit; }
.viewport[data-mode="erase"] .measurement-hit { pointer-events: stroke; cursor: pointer; }
.viewport[data-mode="erase"] .measurement-label { pointer-events: all; cursor: pointer; }
.viewport[data-mode="erase"] .measurement-line:focus { outline: none; }
.viewport[data-mode="erase"] .measurement-line:is(.is-erase-target, :focus-visible) :is(.measurement-stroke, .measurement-end) { stroke: #ba3737; }
.viewport[data-mode="erase"] .measurement-line:is(.is-erase-target, :focus-visible) .measurement-label { fill: #ba3737; }
.viewport.is-dragging #scene, .viewport.is-dragging #scene * { cursor: grabbing; }
.viewport:not([data-mode="select"]) #room-controls { display: none; }
.room-handle { --handle-color: #285da4; cursor: ns-resize; }
#office-entry-handle { --handle-color: #a55431; }
.viewport[data-mode="create"] #scene, .viewport[data-mode="create"] #scene * { cursor: crosshair; }
.create-form {
  position: absolute;
  z-index: 1;
  top: 10px;
  left: 10px;
  max-width: calc(100% - 20px);
  display: flex;
  align-items: end;
  gap: 7px 12px;
  flex-wrap: wrap;
  padding: 8px 12px;
  background: #f5f8fc;
  border: 1px solid var(--line);
  border-radius: 9px;
  box-shadow: 0 3px 12px #203d571c;
}
.create-form label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
.create-form input, .create-form select { width: 86px; min-height: 36px; padding: 5px 8px; border: 1px solid #b7c8da; border-radius: 6px; background: white; color: var(--ink); font: inherit; }
.create-form select { width: auto; max-width: 100%; }
.rename-form { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.rename-form label { flex: 1 0 100%; color: var(--muted); font-size: 13px; }
.rename-form input { flex: 1; min-width: 100px; padding: 6px 8px; border: 1px solid #b7c8da; border-radius: 6px; font: inherit; }
#delete-custom { color: var(--danger); }
.room-handle:focus { outline: none; }
.room-handle:focus-visible .room-grip circle { stroke-width: 45; }
.room-drag-hit { fill: transparent; stroke: transparent; stroke-width: 24; vector-effect: non-scaling-stroke; pointer-events: all; }
.room-grip { pointer-events: none; }
.room-grip circle { fill: white; stroke: var(--handle-color); stroke-width: 24; }
.room-grip path { fill: none; stroke: var(--handle-color); stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
.object-outline { fill: none; stroke: transparent; stroke-width: 25; stroke-linejoin: round; pointer-events: none; }
.furniture.is-selected > .object-outline { stroke: #145dba; stroke-width: 32; }
.furniture.has-collision > .object-outline { stroke: #be3e3b; stroke-width: 29; stroke-dasharray: 65 34; }
.zoom { position: absolute; right: 13px; bottom: 12px; gap: 3px; padding: 4px; background: white; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 3px 12px #203d571c; }
.zoom button { border: 0; padding: 4px 8px; min-width: 34px; min-height: 33px; }
.zoom output { min-width: 51px; text-align: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.board-footer { min-height: 43px; display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 13px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.board-footer > :last-child { white-space: nowrap; }

.inspector { display: flex; flex-direction: column; min-width: 0; gap: 12px; }
.panel { padding: 15px; min-width: 0; }
.panel-header { justify-content: space-between; gap: 9px; margin-bottom: 10px; }
h2, h3, p { margin: 0; }
h2 { font-size: 16px; font-weight: 750; letter-spacing: -.035em; }
h3 { margin-top: 14px; color: var(--muted); font-size: 14px; }
.empty { font-size: 14px; line-height: 1.6; color: var(--muted); }
.selected-name { font-weight: 750; font-size: 18px; letter-spacing: -.025em; word-break: keep-all; }
.selected-size { margin: 5px 0 10px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.object-actions { gap: 7px; }
.object-actions button { flex: 1; }
#mobile-object-actions, .mobile-selection { display: none; }
.collision-status { background: #fff0ed; color: var(--danger); border: 1px solid #f0c8c2; border-radius: 7px; padding: 8px; margin: 10px 0 0; font-size: 14px; line-height: 1.45; }
.readouts { list-style: none; padding: 0; margin: 4px 0 0; }
.readouts li { display: flex; justify-content: space-between; align-items: center; gap: 7px; padding: 7px 0; border-bottom: 1px solid #edf2f6; font-size: 14px; }
.readouts li:last-child { border-bottom: 0; padding-bottom: 0; }
.readouts li span:first-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.readouts strong { white-space: nowrap; font-weight: 730; font-variant-numeric: tabular-nums; }
.readouts li.overlap strong { color: var(--danger); }
.gap-toggle { min-height: 26px; padding: 2px 5px; font-size: 13px; color: #235390; }
.swatch { width: 13px; height: 13px; flex: 0 0 13px; border-radius: 4px; background: var(--item-color, #71839b); }
.toast { position: fixed; z-index: 5; bottom: 20px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 24px); width: max-content; padding: 12px 16px; border-radius: 9px; background: #172f50; color: white; font-size: 15px; box-shadow: 0 6px 24px #172f5045; }
#print-sheet { display: none; }

@media (max-width: 880px) {
  .workspace { grid-template-columns: minmax(0, 1fr) 262px; gap: 10px; }
  .panel { padding: 12px; }
}
@media (max-width: 690px) {
  .workspace { display: block; padding-top: 10px; }
  .board { overflow: clip; }
  .topbar { flex-wrap: wrap; padding-block: 11px; }
  .identity { gap: 9px; }
  .brand { width: 51px; height: 40px; font-size: 14px; }
  .file-actions { gap: 5px; }
  .file-actions button { font-size: 14px; padding-inline: 9px; min-height: 36px; }
  .viewport { height: min(65svh, 660px); min-height: 385px; }
  .toolbar { padding-inline: 7px; }
  .plan-switch button { min-width: 44px; min-height: 44px; }
  #mobile-object-actions { display: block; position: sticky; top: 0; z-index: 2; background: #f5f8fc; border-bottom: 1px solid var(--line); }
  #mobile-object-actions .object-actions { min-height: 54px; gap: 6px; padding: 5px 8px; }
  #mobile-object-actions button { flex: none; min-height: 44px; padding-inline: 8px; }
  .mobile-selection { display: block; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
  .history { gap: 4px; }
  .history button { padding-inline: 6px; }
  .board-footer { font-size: 13px; }
  .inspector { margin-top: 10px; }
}

@page { size: A4 portrait; margin: 8mm; }
@media print {
  html, body { margin: 0; background: white; }
  .topbar, .workspace, .toast { display: none !important; }
  #print-sheet { display: grid !important; width: 100%; min-height: 0; place-items: center; break-inside: avoid; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  #print-sheet svg { display: block; width: 100%; max-height: 277mm; }
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <div class="brand">KESS</div>
      <div><h1 id="editor-title">2층 배치 편집기</h1><p id="save-status" class="save-status">1안 · 기본 배치</p></div>
    </div>
    <div class="file-actions">
      <button id="copy-link" type="button" hidden>링크 복사</button>
      <button id="export-png" type="button">PNG 저장</button>
      <button id="export-pdf" class="primary" type="button">PDF 저장</button>
    </div>
  </header>

  <main class="workspace">
    <section class="board" aria-label="배치 편집 도면">
      <div class="toolbar">
        <nav class="segmented plan-switch" aria-label="층 선택">
          <button id="floor-2-link" type="button" aria-pressed="true">2층</button>
          <button id="floor-3-link" type="button" aria-pressed="false">3층</button>
          <button id="floor-4-link" type="button" aria-pressed="false">4층</button>
          <button id="floor-5-link" type="button" aria-pressed="false">5층</button>
        </nav>
        <nav id="plan-switch" class="segmented plan-switch" aria-label="배치안 선택">
          <button id="plan-one-link" type="button" aria-pressed="true">1안</button>
          <button id="plan-two-link" type="button" aria-pressed="false">2안</button>
        </nav>
        <div class="segmented" aria-label="도면 도구">
          <button id="select-mode" aria-pressed="true" type="button">가구 이동</button>
          <button id="measure-mode" aria-pressed="false" type="button">거리 측정</button>
          <button id="create-mode" aria-pressed="false" type="button">가구 생성</button>
          <button id="erase-mode" aria-pressed="false" type="button" title="측정선 지우개 (E)"><span class="eraser-icon" aria-hidden="true"></span>지우개</button>
        </div>
        <div class="history" aria-label="배치 변경 기록">
          <button id="undo" type="button" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기">↶</button>
          <button id="redo" type="button" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행">↷</button>
          <button id="clear-measurements" type="button" hidden>측정선 모두 지우기</button>
          <button id="reset" type="button">기본 배치로</button>
        </div>
      </div>
      <div id="mobile-object-actions" aria-label="선택한 가구 편집"></div>
      <div id="viewport" class="viewport" data-mode="select">
        <svg xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-weight="400" data-d-component="svg" fill="#222222" style="color:#222222" viewBox="-850 -750 11600 13250" width="1160" height="1325" data-plan="1" id="scene" aria-label="KESS 2층 배치 1안">
  <g id="plan-background">
  <rect x="-850" y="-750" width="11600" height="13250" fill="#FFFFFF" />
  <polygon points="0,0 9597,0 9597,10723 0,11938" fill="#FFFFFF" stroke="#222222" stroke-width="40" />
  <path d="M0 0 H9597 V400 H1130 V1868 H625 V400 H0 Z" fill="#F3E5D7" />
  <rect x="9197" y="400" width="400" height="3945" fill="#F3E5D7" />
  <rect x="0" y="0" width="625" height="1868" fill="#171717" />
  <rect x="8000" y="1200" width="625" height="625" fill="#171717" />
  <polygon id="ceo-room-fill" points="0,5989 3744,5989 3744,11464 0,11938" fill="#F0F1F3" stroke="none" />
  <path id="ceo-room-top" d="M0 5989 H2758 M3658 5989 H3744" stroke="#222222" stroke-width="35" fill="none" />
  <path id="ceo-room-right" d="M3744 5989 V11464" stroke="#222222" stroke-width="35" fill="none" />
  <path id="ceo-room-outer" d="M0 5989 V11938 L3744 11464" stroke="#222222" stroke-width="40" fill="none" />
  <path d="M0 7189 H9597" stroke="#D97745" stroke-width="18" fill="none" stroke-dasharray="90 65" opacity="0.75" />
  <rect x="0" y="9964" width="600" height="625" fill="#171717" />
  <rect x="7828" y="9889" width="725" height="625" fill="#171717" />
  <text x="300" y="10335" font-size="165" fill="#FFFFFF" text-anchor="middle" font-weight="400">기둥</text>
  <g id="ceo-room-door" transform="translate(3658 5989)">
    <path d="M0 0 V900" stroke="#A85B3D" stroke-width="18" fill="none" />
    <path d="M-900 0 A900 900 0 0 0 0 900" stroke="#A85B3D" stroke-width="16" fill="none" stroke-dasharray="55 45" />
  </g>
  <text id="ceo-room-door-label" x="3208" y="5759" font-size="180" fill="#333333" text-anchor="middle" font-weight="400">출입문</text>
  <text id="ceo-room-label" x="1650" y="6245" font-size="270" fill="#333333" text-anchor="middle" font-weight="700">대표이사실</text>
  <path id="main-aisle-line" d="M680 5300 H7350 V6800" stroke="#888888" stroke-width="22" fill="none" stroke-dasharray="85 65" />
  <path d="M7250 6670 L7350 6800 L7450 6670" stroke="#888888" stroke-width="22" fill="none" />
  <text id="main-aisle-label" x="3500" y="5200" font-size="215" fill="#777777" text-anchor="middle" font-weight="400">주 이동 통로</text>
  <text x="5700" y="6980" font-size="175" fill="#B45309" text-anchor="middle" font-weight="700">기존 회의실 상부 벽 철거</text>
  <path d="M0 -385 V-215 M9597 -385 V-215 M0 -300 H9597" stroke="#777777" stroke-width="16" fill="none" />
  <text x="4798.5" y="-410" font-size="235" fill="#555555" text-anchor="middle" font-weight="400">9,597mm</text>
  <text x="0" y="-455" font-size="270" fill="#333333" text-anchor="start" font-weight="700">1안</text>
  <path d="M9750 0 H10030 M9750 10723 H10030 M9900 0 V10723" stroke="#777777" stroke-width="16" fill="none" />
  <text x="10160" y="5360" font-size="220" fill="#555555" text-anchor="middle" font-weight="400" transform="rotate(90 10160 5360)">10,723mm</text>
  <path id="ceo-room-dimension" d="M-260 5989 H0 M-260 7189 H0 M-260 5989 V7189" stroke="#D97706" stroke-width="22" fill="none" />
  <text id="ceo-room-dimension-label" x="-400" y="6589" font-size="155" fill="#B45309" text-anchor="middle" font-weight="700" transform="rotate(-90 -400 6589)">1,200 확장</text>
  <path d="M0 9840 V9740 M600 9840 V9740 M0 9790 H600" stroke="#777777" stroke-width="15" fill="none" />
  <text x="300" y="9700" font-size="155" fill="#555555" text-anchor="middle" font-weight="400">600</text>
  </g>
  <g id="office-entry" transform="translate(0 4200)">
    <rect width="550" height="900" fill="#FFFFFF" stroke="#222222" stroke-width="28" />
    <text x="275" y="370" font-size="190" text-anchor="middle" fill="#222222">출입</text>
    <text x="275" y="600" font-size="190" text-anchor="middle" fill="#222222">문</text>
  </g>
  <g id="furniture-layer"><g transform="translate(0 1868)" id="fridge" class="furniture" data-item="fridge" role="button" tabindex="0" aria-label="냉장고" aria-pressed="false" data-name-area="36 65 528 540" data-default-label="냉장고" data-name-color="#444444">
    <rect width="600" height="1300" rx="20" fill="#E5E7EB" stroke="#777777" stroke-width="22" />
    <path d="M0 650 H600" stroke="#999999" stroke-width="15" />
    <path d="M480 560 H550 M480 740 H550" stroke="#777777" stroke-width="25" stroke-linecap="round" />
    <g id="fridge-label">
      <rect x="42" y="235" width="516" height="830" rx="15" fill="#E5E7EB" />
      <g data-label-box="48 620 504 520">
        <text x="300" y="805" font-size="145" fill="#444444" text-anchor="middle" font-weight="400">600 ×</text>
        <text x="300" y="1015" font-size="145" fill="#444444" text-anchor="middle" font-weight="400">1,300</text>

  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const distance = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const mix = (a, b, ratio) => [a[0] + (b[0] - a[0]) * ratio, a[1] + (b[1] - a[1]) * ratio];
  const polygonEdges = outline => outline.map((point, index) => [point, outline[(index + 1) % outline.length]]);

  function project(point, a, b) {
    const delta = subtract(b, a);
    const lengthSquared = dot(delta, delta);
    const ratio = lengthSquared ? Math.max(0, Math.min(1, dot(subtract(point, a), delta) / lengthSquared)) : 0;
    const result = mix(a, b, ratio);
    return { point: result, ratio, distance: distance(point, result) };
  }

  function intersection(a, b, c, d, proper = false) {
    const ab = subtract(b, a);
    const cd = subtract(d, c);

  if (PLAN) layoutSessions.set(saveKey, { state, canStore, undoStack, redoStack, view });

  floorNumber = floor;
  planNumber = floor === 2 ? plan : 0;
  if (planNumber) lastSecondFloorPlan = planNumber;
  planName = planNumber ? '2층 · ' + planNumber + '안' : floorNumber + '층';
  PLAN = next;
  saveKey = 'kess-floor-planner:' + PLAN.revision;

  const saved = layoutSessions.get(saveKey);
  state = saved?.state ?? fresh();
  canStore = saved?.canStore ?? true;
  undoStack = saved?.undoStack ?? [];
  redoStack = saved?.redoStack ?? [];
  view = saved?.view ?? [...PLAN.viewBox];
  selected = planNumber ? 'copier' : null;
  nameEditorItem = null;
  shownGap = null;
  gapHidden = false;
  mountLayout();
  if (!saved && !openBase) readLayout();
  updateView();
  setMode('select');
  updateStatus();
}

function el(tag, cssClass, text) {
  const node = document.createElement(tag);
  if (cssClass) node.className = cssClass;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attributes = {}, text) {
  const node = document.createElementNS(ns, tag);
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
  if (text !== undefined) node.textContent = text;
  return node;
}

scene.addEventListener('keydown', event => {
  const target = event.target.closest?.('[data-item]');
  if (gesture || !target || !['Enter', ' '].includes(event.key)) return;
  event.preventDefault();
  setMode('select');
  selectItem(target.dataset.item);
});

function toast(message) {
  const node = byId('toast');
  node.textContent = message;
  node.hidden = false;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { node.hidden = true; }, 3600);
}

function save() {
  if (canStore) {
    try { localStorage.setItem(saveKey, JSON.stringify({ ...state, layoutVersion })); }
    catch { canStore = false; }
  }
  updateStatus();
}

function updateStatus() {
  const status = !canStore ? '이 탭에서만 변경 사항 유지'
    : sameState(state, fresh()) ? '기본 배치' : '내 배치 · 이 브라우저에 저장됨';
  byId('save-status').textContent = `${planName} · ${status}`;
}

function updateHistory() {
  byId('undo').disabled = !undoStack.length;
  byId('redo').disabled = !redoStack.length;
  byId('reset').disabled = sameState(state, fresh());
}

function commit(previous) {
  if (sameState(previous, state)) return;
  undoStack.push(previous);
  if (undoStack.length > 100) undoStack.shift();
  redoStack.length = 0;
  save();
  draw();
}

function edit(change) {
  const previous = copyState(state);
  change();
  commit(previous);
}

function travel(from, to) {
  if (!from.length || gesture) return;
  to.push(copyState(state));
  state = from.pop();
  save();
  draw();
}

function selectItem(id) {
  if (selected !== id) { shownGap = null; gapHidden = false; }
  selected = id;
  draw();
}

function setMode(next) {
  if (gesture) return;
  if (next !== mode) { pendingAnchor = null; currentAnchor = null; }
  mode = next;
  viewport.dataset.mode = mode;
  byId('select-mode').setAttribute('aria-pressed', mode === 'select');
  byId('measure-mode').setAttribute('aria-pressed', mode === 'measure');
  byId('erase-mode').setAttribute('aria-pressed', mode === 'erase');
  byId('create-mode').setAttribute('aria-pressed', mode === 'create');
  byId('create-form').hidden = mode !== 'create';
  draw();
}

function updatePose(item, pose) {
  const [cx, cy] = item.center;
  const sign = pose.flip ? -1 : 1;
  item.node.setAttribute('transform', `translate(${pose.x} ${pose.y}) translate(${cx} ${cy}) rotate(${pose.angle}) scale(${sign} 1) translate(${-cx} ${-cy})`);
  const sideways = pose.angle % 180 !== 0;
  for (const { element, area, bounds } of item.labels) {
    const [left, top, width, height] = area;
    if (!pose.angle && !pose.flip && bounds.x >= left && bounds.y >= top
        && bounds.x + bounds.width <= left + width && bounds.y + bounds.height <= top + height) {
      element.removeAttribute('transform');
      continue;
    }
    // Counter-rotate the entire label so its lines keep their original spacing.
    const [availableWidth, availableHeight] = sideways ? [height, width] : [width, height];
    const fit = Math.min(1, availableWidth / bounds.width, availableHeight / bounds.height);
    const labelX = bounds.x + bounds.width / 2;
    const labelY = bounds.y + bounds.height / 2;
    element.setAttribute('transform',
      `translate(${left + width / 2} ${top + height / 2}) scale(${sign} 1) rotate(${-pose.angle}) scale(${fit}) translate(${-labelX} ${-labelY})`);
  }
}

function roomTop(extension) {
  return roomLimits.originalTop - extension;
}

function clampExtension(extension, entryY) {
  const minTop = Math.max(roomLimits.minTop, entryY + entry.height);
  return Math.max(0, Math.min(roomLimits.originalTop - minTop, Math.round(extension)));
}

function entryLimit(room) {
  return (room ? roomTop(room.extension) : 10400) - entry.height;
}

function clampEntry(y, room) {
  return Math.max(entry.minY, Math.min(entryLimit(room), Math.round(y)));
}

function moveRoomControl(handle, start, deltaY, step) {
  const delta = Math.round(deltaY / step) * step;
  if (handle === 'wall') {
    state.room.extension = clampExtension(start.room.extension - delta, start.entryY);
  } else {
    state.entryY = clampEntry(start.entryY + delta, start.room);
  }
}

function rectangle(w, h, x = 0, y = 0) {
  return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
}

function roomGeometry({ extension }) {
  const { right, rightBottom, doorLeft, doorWidth } = roomLimits;
  const top = roomTop(extension);
  const doorRight = doorLeft + doorWidth;
  const topSegments = [[[0, top], [doorLeft, top]], [[doorRight, top], [right, top]]];
  const rightSegments = [[[right, top], [right, rightBottom]]];
  const hinge = { x: doorRight, y: top, angle: 0, flip: false };
  const swing = [[0, 0], ...Array.from({ length: 61 }, (_, index) => {
    const angle = Math.PI - index * Math.PI / 120;
    return [doorWidth * Math.cos(angle), doorWidth * Math.sin(angle)];
  })];
  const shapes = {
    'room-top-wall': Geometry.shape(undefined, topSegments),
    'room-right-wall': Geometry.shape(undefined, rightSegments),
    'door-swing': Geometry.shape(Geometry.place(swing, [0, 0], hinge)),
  };
  return { top, hinge, shapes };
}

function segmentsPath(segments) {
  return segments.map(([a, b]) => `M${a.join(' ')} L${b.join(' ')}`).join(' ');
}

function drawRoomGrip(id, centre, value, max, description) {
  const handle = byId(id);
  handle.setAttribute('transform', `translate(${centre.join(' ')})`);
  handle.setAttribute('aria-valuemin', 0);
  handle.setAttribute('aria-valuemax', max);
  handle.setAttribute('aria-valuenow', value);
  handle.setAttribute('aria-valuetext', description);
}

function updateCeoRoom() {
  const { extension } = state.room;
  const { originalTop, minTop, right, rightBottom, leftBottom, doorLeft } = roomLimits;
  const { top, hinge, shapes } = roomGeometry(state.room);
  const topEdges = shapes['room-top-wall'].edges;
  byId('ceo-room-fill').setAttribute('points', `0,${top} ${right},${top} ${right},${rightBottom} 0,${leftBottom}`);
  byId('ceo-room-top').setAttribute('d', segmentsPath(topEdges));
  byId('ceo-room-right').setAttribute('d', segmentsPath(shapes['room-right-wall'].edges));
  byId('ceo-room-outer').setAttribute('d', `M0 ${top} V${leftBottom} L${right} ${rightBottom}`);
  byId('ceo-room-door').setAttribute('transform', `translate(${hinge.x} ${hinge.y}) rotate(${hinge.angle})`);

  byId('ceo-room-door-label').setAttribute('y', top - 230);
  byId('ceo-room-label').setAttribute('y', top + 270);

  const aisle = Math.min(5300, top - 300);
  byId('main-aisle-line').setAttribute('d', `M680 ${aisle} H7350 V6800`);
  byId('main-aisle-label').setAttribute('y', aisle - 100);
  const middle = (originalTop + top) / 2;
  byId('ceo-room-dimension').setAttribute('d', extension
    ? `M-260 ${top} H0 M-260 ${originalTop} H0 M-260 ${top} V${originalTop}` : '');
  const dimension = byId('ceo-room-dimension-label');
  dimension.setAttribute('y', middle);
  dimension.setAttribute('transform', `rotate(-90 -400 ${middle})`);
  dimension.textContent = extension ? `${format.format(extension)} 확장` : '확장 없음';
  byId('board-unit').textContent = `확장 ${mm(extension)}`;

  drawRoomGrip('ceo-wall-handle', [doorLeft / 2, top],
    extension, originalTop - Math.max(minTop, state.entryY + entry.height), mm(extension));
  return shapes;
}

function updateEntry() {
  const { width, height, minY } = entry;
  const y = state.entryY;
  byId('office-entry').setAttribute('transform', `translate(0 ${y})`);
  drawRoomGrip('office-entry-handle', [width, y + height / 2],
    y - minY, entryLimit(state.room) - minY, `왼쪽 위에서 ${mm(y)}`);
  return { id: 'main-entry', name: '사무실 출입구', ...Geometry.shape(rectangle(width, height, 0, y)) };
}

function validSize(value) {
  return Number.isInteger(value) && value >= 1 && value <= 100000;
}

function cleanName(value) {
  return typeof value === 'string' ? value.trim().replace(/\s+/g, ' ').slice(0, 48) : '';
}

function displayedName(item) {
  return state.names[item.id] ?? item.name;
}

function balancedNameLines(characters, count) {
  const lines = [];
  let remaining = characters;
  for (let rows = count; rows > 1 && remaining.length; rows--) {
    const middle = Math.ceil(remaining.length / rows);
    const offset = remaining[middle - 1] === ' ' && middle > 1 ? -1 : 0;
    const split = middle + offset;
    lines.push(remaining.slice(0, split).join('').trim());
    remaining = remaining.slice(split);
    if (remaining[0] === ' ') remaining = remaining.slice(1);
  }
  if (remaining.length) lines.push(remaining.join(''));
  return lines;
}

function fitFurnitureName(label, name, width, height) {
  const characters = Array.from(name);
  const maxSize = 300;
  const lineHeight = 1.14;
  label.setAttribute('font-size', maxSize);
  let best;
  for (let count = 1; count <= Math.min(4, characters.length); count++) {
    const lines = balancedNameLines(characters, count);
    let maxLength = 0;
    for (const line of lines) {
      label.textContent = line;
      maxLength = Math.max(maxLength, label.getComputedTextLength());
    }
    const size = Math.min(maxSize, maxSize * width / Math.max(1, maxLength),
      height / ((lines.length - 1) * lineHeight + 1.2));
    if (!best || size > best.size * 1.05) best = { lines, size };
    if (best.size === maxSize) break;
  }
  label.textContent = '';
  label.setAttribute('font-size', best.size);
  for (const [index, line] of best.lines.entries()) {
    label.append(svgEl('tspan', { x: 0, y: index * best.size * lineHeight }, line));
  }
}

function updateFurnitureName(item, pose) {
  const customName = state.names[item.id];
  const name = customName ?? item.defaultLabel ?? item.name;
  const sideways = pose.angle % 180 !== 0;
  if (item.nameLabel && name === item.renderedName && sideways === item.renderedSideways) return;
  if (!item.detailLabels) item.detailLabels = item.labels;
  const area = item.nameArea;
  item.nameLabel?.remove();
  const label = svgEl('text', { 'text-anchor': 'middle', 'font-weight': 700, fill: item.nameColor ?? item.color });
  item.node.append(label);
  const [, , w, h] = area;
  fitFurnitureName(label, name, sideways ? h : w, sideways ? w : h);
  item.nameLabel = label;
  item.renderedName = name;
  item.renderedSideways = sideways;
  item.node.setAttribute('aria-label', displayedName(item));
  item.labels = [{ element: label, area, bounds: label.getBBox() }, ...item.detailLabels];
}

function officeDesk(w, h, right) {
  const mirror = x => right ? w - x : x;
  const points = [[0, 0], [w, 0], [w, 700], [850, 700]];
  for (let i = 1; i <= 20; i++) {
    const t = i / 20;
    const r = 1 - t;
    points.push([850 * r * r + 700 * 2 * r * t + 700 * t * t, 700 + 150 * t * t]);
  }
  points.push([700, h], [0, h]);
  return {
    outline: points.map(([x, y]) => [mirror(x), Math.round(y * 1000) / 1000]),
    path: 'M' + mirror(0) + ' 0 H' + mirror(w) + ' V700 H' + mirror(850)
      + ' Q' + mirror(700) + ' 700 ' + mirror(700) + ' 850 V' + h + ' H' + mirror(0) + ' Z',
    labelArea: [45, 45, w - 90, 610],
    chair: [mirror(w - 470), h - 120],
  };
}

function syncCustomFurniture() {
  for (const [id, item] of items) {
    if (item.custom && !Object.hasOwn(state.custom, id)) {
      item.node.remove();
      items.delete(id);
      if (selected === id) selected = null;
    }
  }
  for (const [id, { w, h, kind }] of Object.entries(state.custom)) {
    if (items.has(id)) continue;
    const desk = deskPresets.has(kind) ? officeDesk(w, h, kind.endsWith('-right')) : null;
    const name = desk ? '사무용 책상' : '새 가구 ' + id.slice(7);
    const color = '#285da4';
    const center = [w / 2, h / 2];
    const outline = desk?.outline ?? rectangle(w, h);
    const node = svgEl('g', { id, class: 'furniture', 'data-item': id, role: 'button',
      tabindex: 0, 'aria-label': name, 'aria-pressed': false });
    const appearance = { fill: '#e8f0ff', stroke: color, 'stroke-width': Math.min(23, w / 4, h / 4) };
    node.append(desk ? svgEl('path', { d: desk.path, ...appearance }) : svgEl('rect', { width: w, height: h, ...appearance }));
    if (desk) node.append(svgEl('circle', { cx: desk.chair[0], cy: desk.chair[1], r: 250, fill: 'none',
      stroke: color, 'stroke-width': 18, 'stroke-dasharray': '45 32', 'pointer-events': 'none' }));
    const inset = Math.min(40, w / 10, h / 10);
    const nameArea = desk?.labelArea ?? [inset, inset, w - 2 * inset, h - 2 * inset];
    node.append(svgEl('polygon', { class: 'object-outline', 'aria-hidden': 'true',
      points: outline.map(point => point.join(',')).join(' ') }));
    byId('furniture-layer').append(node);
    items.set(id, { id, name, color, center, outline, w, h, node, custom: true, nameArea, labels: [] });
  }
}

function furniturePlacement(start, end, moved) {
  const preset = deskPresets.get(byId('create-kind').value);
  if (preset) {
    return { ...preset, x: Math.round(end[0] - preset.w / 2), y: Math.round(end[1] - preset.h / 2) };
  }
  return moved ? creationBox(start, end) : null;
}

function creationBox(a, b) {
  const snap = value => Math.round(value / 10) * 10;
  return {
    x: snap(Math.min(a[0], b[0])), y: snap(Math.min(a[1], b[1])),
    w: Math.max(10, snap(Math.abs(a[0] - b[0]))),
    h: Math.max(10, snap(Math.abs(a[1] - b[1]))),
  };
}

function drawCreationPreview(box) {
  const preview = byId('creation-preview');
  preview.replaceChildren();
  if (!box) return;
  const { x, y, w, h } = box;
  preview.append(
    svgEl('rect', { x, y, width: w, height: h, fill: '#bdd8fc', 'fill-opacity': '.55',
      stroke: '#285da4', 'stroke-width': 24, 'stroke-dasharray': '42 24' }),
    svgEl('text', { x: x + w / 2, y: y - 70, 'text-anchor': 'middle', 'font-size': 175,
      fill: '#204e8b', stroke: '#fff', 'stroke-width': 36, 'paint-order': 'stroke fill' },
      `${format.format(w)} × ${mm(h)}`),
  );
}

function createFurniture(point, box) {
  const width = byId('create-width');
  const height = byId('create-height');
  const kind = byId('create-kind').value;
  const preset = deskPresets.get(kind);
  const w = preset?.w ?? box?.w ?? width.valueAsNumber;
  const h = preset?.h ?? box?.h ?? height.valueAsNumber;
  if (!validSize(w) || !validSize(h)) {
    (validSize(w) ? height : width).reportValidity();
    return;
  }
  const x = box?.x ?? Math.round(point[0] - w / 2);
  const y = box?.y ?? Math.round(point[1] - h / 2);
  let number = 1;
  while (Object.hasOwn(state.custom, `custom-${number}`)) number++;
  const id = `custom-${number}`;
  width.value = w;
  height.value = h;
  edit(() => {
    state.custom[id] = preset ? { w, h, kind } : { w, h };
    state.poses[id] = { x, y, angle: 0, flip: false };
    selected = id;
    shownGap = null;
    gapHidden = false;
  });
  setMode('select');
  items.get(id).node.focus({ preventScroll: true });
}

function deleteCustomFurniture() {
  const id = selected;
  if (gesture || !items.get(id)?.custom) return;
  const detach = anchor => anchor.id === id ? { point: resolveAnchor(anchor) } : anchor;
  edit(() => {
    state.measures = state.measures.map(({ a, b }) => ({ a: detach(a), b: detach(b) }));
    delete state.custom[id];
    delete state.poses[id];
    delete state.names[id];
    selected = null;
  });
  byId('select-mode').focus();
}

function updateShapes() {
  syncCustomFurniture();
  plotted = new Map(fixed.map(part => [part.id, part]));
  if (planNumber) plotted.set('main-entry', updateEntry());
  if (state.room) {
    for (const [id, shape] of Object.entries(updateCeoRoom())) {
      plotted.set(id, { id, name: roomNames[id], ...shape });
    }
  }
  for (const item of items.values()) {
    const pose = state.poses[item.id];
    updateFurnitureName(item, pose);
    updatePose(item, pose);
    const outline = Geometry.place(item.outline, item.center, pose);
    plotted.set(item.id, { id: item.id, name: displayedName(item), ...Geometry.shape(outline) });
  }
}

function isCollision(left, right) {
  return right.isFloor ? Geometry.outside(left, right) : Geometry.overlap(left, right);
}

function resolveAnchor(anchor) {
  const edge = plotted.get(anchor.id)?.edges[anchor.edge];
  return edge ? Geometry.mix(edge[0], edge[1], anchor.ratio) : anchor.point;
}

function drawDimension(a, b, main, dashed = false, temporary = false, measureIndex = null) {
  const distance = Geometry.distance(a, b);
  if (distance < .5) return;
  const color = main ? '#1c58a0' : '#8c4f14';
  const group = svgEl('g', { 'data-temporary': temporary || null });
  const stroke = { stroke: color, 'stroke-width': 21, 'stroke-linecap': 'round' };
  const coordinates = { x1: a[0], y1: a[1], x2: b[0], y2: b[1] };
  if (measureIndex !== null) {
    group.classList.add('measurement-line');
    group.setAttribute('data-measure-index', measureIndex);
    group.append(svgEl('line', { ...coordinates, class: 'measurement-hit', stroke: 'transparent',
      'stroke-width': 24, 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke', 'aria-hidden': 'true' }));
    if (mode === 'erase') {
      group.setAttribute('tabindex', '0');
      group.setAttribute('role', 'button');
      group.setAttribute('aria-label', `${mm(distance)} 측정선 지우기`);
      group.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        event.stopPropagation();
        eraseMeasurement(measureIndex);
        const remaining = annotations.querySelectorAll('.measurement-line');
        (remaining[Math.min(measureIndex, remaining.length - 1)] ?? byId('erase-mode')).focus();
      });
    }
  }
  group.append(svgEl('line', { ...coordinates, ...stroke, class: 'measurement-stroke',
    ...(dashed ? { 'stroke-dasharray': '46 31' } : {}) }));
  for (const point of [a, b]) group.append(svgEl('circle', { cx: point[0], cy: point[1], r: 33, fill: '#fff', ...stroke, class: 'measurement-end' }));
  const mid = Geometry.mix(a, b, .5);
  const dx = (b[0] - a[0]) / distance;
  const dy = (b[1] - a[1]) / distance;
  const side = dx < 0 ? -1 : 1;
  const isShortClearance = main && dashed && !temporary && distance < 400;
  group.append(svgEl('text', {
    class: measureIndex === null ? '' : 'measurement-label',
    x: mid[0] + dy * 145 * side + (isShortClearance ? 250 : 0),
    y: mid[1] - dx * 145 * side - (isShortClearance ? 135 : 0),
    'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-weight': 750, 'font-size': 186,
    fill: color, stroke: '#fff', 'stroke-width': 45, 'stroke-linejoin': 'round', 'paint-order': 'stroke fill',
  }, mm(distance)));
  annotations.append(group);
}

function readout(name, value, collision = false) {
  const row = el('li', collision ? 'overlap' : '');
  const label = el('span', '', name);
  label.title = name;
  row.append(label, el('strong', '', value));
  return row;
}

function drawSelection(gaps, collisionNames) {
  const detail = byId('selection-details');
  const empty = byId('selection-empty');
  const swatch = byId('selection-color');
  detail.hidden = !selected;
  empty.hidden = Boolean(selected);
  swatch.hidden = !selected;
  const item = items.get(selected);
  byId('mobile-selection').textContent = item ? displayedName(item) : '가구를 선택하세요';
  byId('rotate').disabled = byId('flip').disabled = !item || mode !== 'select';
  byId('delete-custom').hidden = !item?.custom || mode !== 'select';
  if (!selected) {
    nameEditorItem = null;
    return;
  }
  const name = state.names[selected] ?? '';
  if (nameEditorItem !== selected || nameEditorValue !== name) {
    byId('furniture-name').value = name || item.name;
    nameEditorItem = selected;
    nameEditorValue = name;
  }
  const pose = state.poses[selected];
  const turned = pose.angle % 180 !== 0;
  byId('selected-name').textContent = displayedName(item);
  byId('selected-size').textContent = `${format.format(turned ? item.h : item.w)} × ${mm(turned ? item.w : item.h)} · ${pose.angle}°`;
  swatch.style.setProperty('--item-color', item.color);
  const warning = byId('collision-status');
  warning.hidden = !collisionNames.length;
  warning.textContent = collisionNames.length ? `겹침 · ${collisionNames.join(', ')}` : '';
  const list = byId('clearance-list');
  list.replaceChildren();
  for (const gap of gaps.slice(0, 3)) {
    const row = readout(gap.name, gap.collision ? '겹침' : mm(gap.distance), gap.collision);
    if (!gap.collision && gap.distance >= .5) {
      const action = el('button', 'gap-toggle', gap.id === shownGap && !gapHidden ? '숨기기' : '표시');
      action.type = 'button';
      action.setAttribute('aria-label', `${gap.name} 간격 표시 전환`);
      action.addEventListener('click', () => {
        gapHidden = shownGap === gap.id && !gapHidden;
        shownGap = gap.id;
        draw();
      });
      row.append(action);
    }
    list.append(row);
  }
}

function draw() {
  updateShapes();
  annotations.replaceChildren();
  const all = [...plotted.values()];
  let gaps = [];
  for (const item of items.values()) {
    const object = plotted.get(item.id);
    const active = item.id === selected;
    const neighbours = all.filter(other => other.id !== item.id);
    const hasCollision = neighbours.some(other => isCollision(object, other));
    item.node.classList.toggle('is-selected', active);
    item.node.classList.toggle('has-collision', hasCollision);
    item.node.setAttribute('aria-pressed', active);
    if (active) {
      gaps = neighbours.map(other => ({ id: other.id, name: other.name, collision: isCollision(object, other),
        ...Geometry.closestEdges(object.edges, other.edges) }))
        .sort((a, b) => Number(b.collision) - Number(a.collision) || a.distance - b.distance);
    }
  }
  if (!gaps.some(gap => gap.id === shownGap)) {
    shownGap = gaps.find(gap => !gap.collision && gap.distance >= .5)?.id ?? null;
    gapHidden = false;
  }
  const displayed = gaps.find(gap => gap.id === shownGap && !gap.collision);
  if (displayed && !gapHidden && mode === 'select') drawDimension(displayed.a, displayed.b, true, true);
  drawSelection(gaps, gaps.filter(gap => gap.collision).map(gap => gap.name));
  drawMeasurements();
  if (mode === 'measure' && pendingAnchor) {
    const start = resolveAnchor(pendingAnchor);
    annotations.append(svgEl('circle', { cx: start[0], cy: start[1], r: 58, fill: '#1c58a0', stroke: 'white', 'stroke-width': 20, 'data-temporary': true }));
    if (currentAnchor) drawDimension(start, resolveAnchor(currentAnchor), true, true, true);
  }
  byId('board-hint').textContent = mode === 'measure'
    ? (pendingAnchor ? '두 번째 지점을 선택하세요' : '거리의 첫 지점을 선택하세요 · 가까운 가구 모서리에 맞춰집니다')
    : mode === 'erase' ? '지울 측정선이나 숫자를 누르세요'
      : mode === 'create' ? (deskPresets.has(byId('create-kind').value) ? '책상을 놓을 위치를 누르세요'
        : '사각형을 끌어 그리거나, 치수를 입력하고 놓을 자리를 누르세요')
        : state.room ? '가구를 끌어 이동 · 대표이사실 벽과 왼쪽 출입문은 손잡이를 끌어 조절'
        : planNumber ? '가구를 끌어 이동 · 왼쪽 출입문은 손잡이를 끌어 조절'
          : '가구를 생성하거나 끌어서 이동하세요';
  updateHistory();
}

function drawMeasurements() {
  byId('clear-measurements').hidden = mode !== 'erase' || !state.measures.length;
  for (const [index, measurement] of state.measures.entries()) {
    drawDimension(resolveAnchor(measurement.a), resolveAnchor(measurement.b), false, false, false, index);
  }
}

function eraseMeasurement(index) {
  if (index >= 0 && index < state.measures.length) edit(() => state.measures.splice(index, 1));
}

function measurementAt(point, target) {
  const label = target.closest('.measurement-label');
  if (label) return Number(label.closest('[data-measure-index]').dataset.measureIndex);
  let limit = 12 / Math.abs(scene.getScreenCTM().a);
  let nearest = -1;
  for (const [index, measurement] of state.measures.entries()) {
    const distance = Geometry.project(point, resolveAnchor(measurement.a), resolveAnchor(measurement.b)).distance;
    if (distance <= limit) { limit = distance; nearest = index; }
  }
  return nearest;
}

function drawSoon() {
  if (!scheduled) scheduled = requestAnimationFrame(() => { scheduled = 0; draw(); });
}

function screenPoint(clientX, clientY, matrix = scene.getScreenCTM().inverse()) {
  const point = new DOMPoint(clientX, clientY).matrixTransform(matrix);
  return [point.x, point.y];
}

function snapAnchor(point) {
  const threshold = 11 / Math.abs(scene.getScreenCTM().a);
  let closest = { point: point.map(Math.round), distance: threshold };
  for (const object of plotted.values()) {
    for (const [edge, [a, b]] of object.edges.entries()) {
      const candidate = Geometry.project(point, a, b);
      if (candidate.distance < closest.distance) closest = { id: object.id, edge, ...candidate };
    }
  }
  const { distance, ...anchor } = closest;
  return anchor;
}

function takeMeasurement(point) {
  const next = snapAnchor(point);
  if (!pendingAnchor) {
    pendingAnchor = next;
    currentAnchor = null;
    draw();
    return;
  }
  if (Geometry.distance(resolveAnchor(next), resolveAnchor(pendingAnchor)) < 1) return;
  if (state.measures.length >= 50) {
    toast('측정값은 50개까지 저장할 수 있어요.');
    return;
  }
  const first = pendingAnchor;
  pendingAnchor = null;
  currentAnchor = null;
  edit(() => state.measures.push({ a: first, b: next }));
}

function updateView() {
  scene.setAttribute('viewBox', view.join(' '));
  byId('zoom-level').textContent = `${Math.round(PLAN.viewBox[2] / view[2] * 100)}%`;
}

function zoom(factor, focus = [view[0] + view[2] / 2, view[1] + view[3] / 2]) {
  if (gesture) return;
  const width = Math.max(PLAN.viewBox[2] / 5, Math.min(PLAN.viewBox[2] * 1.25, view[2] / factor));
  const ratio = width / view[2];
  view = [focus[0] + (view[0] - focus[0]) * ratio, focus[1] + (view[1] - focus[1]) * ratio, width, view[3] * ratio];
  updateView();
}

scene.addEventListener('dragstart', event => event.preventDefault());
scene.addEventListener('wheel', event => {
  event.preventDefault();
  if (gesture || event.buttons || event.deltaY === 0) return;
  zoom(event.deltaY < 0 ? 1.13 : 1 / 1.13, screenPoint(event.clientX, event.clientY));
}, { passive: false });

scene.addEventListener('pointerdown', event => {
  if (event.button === 1) event.preventDefault();
  if (gesture || event.button !== 0) return;
  if (mode === 'measure') {
    event.preventDefault();
    takeMeasurement(screenPoint(event.clientX, event.clientY));
    return;
  }
  if (mode === 'erase') {
    const index = measurementAt(screenPoint(event.clientX, event.clientY), event.target);
    if (index !== -1) {
      event.preventDefault();
      eraseMeasurement(index);
    }
    return;
  }
  if (mode === 'create') {
    const inverse = scene.getScreenCTM().inverse();
    const point = screenPoint(event.clientX, event.clientY, inverse);
    gesture = { pointer: event.pointerId, create: true, point, inverse, moved: false };
    event.preventDefault();
    scene.setPointerCapture(event.pointerId);
    return;
  }
  const hit = event.target.closest('[data-item], [data-room-handle]');
  if (!hit) {
    gesture = { pointer: event.pointerId, background: true, point: [event.clientX, event.clientY], moved: false };
    event.preventDefault();
    scene.setPointerCapture(event.pointerId);
    return;
  }
  const id = hit.getAttribute('data-item');
  const roomHandle = hit.getAttribute('data-room-handle');
  const inverse = scene.getScreenCTM().inverse();
  const point = screenPoint(event.clientX, event.clientY, inverse);
  hit.focus({ preventScroll: true });
  selectItem(id);
  gesture = { pointer: event.pointerId, id, roomHandle, point, inverse, startState: copyState(state), moved: false };
  event.preventDefault();
  scene.setPointerCapture(event.pointerId);
});

scene.addEventListener('pointermove', event => {
  if (!gesture) {
    if (mode === 'measure' && pendingAnchor) {
      currentAnchor = snapAnchor(screenPoint(event.clientX, event.clientY));
      drawSoon();
    }
    if (mode === 'erase') {
      const index = measurementAt(screenPoint(event.clientX, event.clientY), event.target);
      for (const line of annotations.querySelectorAll('.measurement-line')) {
        line.classList.toggle('is-erase-target', Number(line.dataset.measureIndex) === index);
      }
    }
    return;
  }
  if (gesture.pointer !== event.pointerId) return;
  if (gesture.background) {
    if (Geometry.distance(gesture.point, [event.clientX, event.clientY]) >= 3) gesture.moved = true;
    return;
  }
  const point = screenPoint(event.clientX, event.clientY, gesture.inverse);
  const delta = [point[0] - gesture.point[0], point[1] - gesture.point[1]];
  const motion = gesture.roomHandle ? Math.abs(delta[1]) : Math.hypot(...delta);
  if (!gesture.moved && motion * Math.abs(scene.getScreenCTM().a) < 3) return;
  gesture.moved = true;
  if (gesture.create) {
    drawCreationPreview(furniturePlacement(gesture.point, point, true));
    return;
  }
  const step = event.altKey ? 1 : 10;
  if (gesture.roomHandle) {
    moveRoomControl(gesture.roomHandle, gesture.startState, delta[1], step);
  } else {
    viewport.classList.add('is-dragging');
    const start = gesture.startState.poses[gesture.id];
    const pose = state.poses[gesture.id];
    pose.x = Math.round((start.x + delta[0]) / step) * step;
    pose.y = Math.round((start.y + delta[1]) / step) * step;
  }
  drawSoon();
});

function endGesture(event, cancelled = false) {
  if (!gesture || gesture.pointer !== event.pointerId) return;
  const active = gesture;
  gesture = null;
  viewport.classList.remove('is-dragging');
  if (active.background) {
    if (!cancelled && !active.moved && Geometry.distance(active.point, [event.clientX, event.clientY]) < 3) {
      selectItem(null);
    }
    return;
  }
  if (active.create) {
    drawCreationPreview(null);
    if (!cancelled) {
      const point = screenPoint(event.clientX, event.clientY, active.inverse);
      const distance = Geometry.distance(active.point, point) * Math.abs(scene.getScreenCTM().a);
      const box = furniturePlacement(active.point, point, active.moved || distance >= 3);
      createFurniture(point, box);
    }
    return;
  }
  if (cancelled) {
    state = active.startState;
    draw();
  } else commit(active.startState);
}
scene.addEventListener('pointerleave', () => annotations.querySelector('.is-erase-target')?.classList.remove('is-erase-target'));
scene.addEventListener('pointerup', endGesture);
scene.addEventListener('pointercancel', event => endGesture(event, true));
scene.addEventListener('lostpointercapture', event => endGesture(event, true));

function rotateSelected() {
  if (!selected || gesture) return;
  edit(() => { state.poses[selected].angle = (state.poses[selected].angle + 90) % 360; });
}

function flipSelected() {
  if (!selected || gesture) return;
  edit(() => { state.poses[selected].flip = !state.poses[selected].flip; });
}

document.addEventListener('keydown', event => {
  if (event.target.closest?.('input, select')) return;
  const key = event.key.toLowerCase();
  if ((event.ctrlKey || event.metaKey) && (key === 'z' || key === 'y')) {
    event.preventDefault();
    if (key === 'y' || event.shiftKey) travel(redoStack, undoStack);
    else travel(undoStack, redoStack);
    return;
  }
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (key === 'escape') {
    if (mode === 'measure') { pendingAnchor = currentAnchor = null; draw(); }
    else if (mode === 'erase' || mode === 'create') setMode('select');
    else selectItem(null);
  }
  if (key === 'e' && !gesture) setMode(mode === 'erase' ? 'select' : 'erase');
  if (mode !== 'select' || gesture) return;
  const handle = event.target.closest?.('[data-room-handle]');
  if (handle) {
    const name = handle.dataset.roomHandle;
    const step = event.shiftKey ? 10 : 100;
    const span = roomLimits.rightBottom - roomLimits.minTop;
    const delta = {
      arrowup: -step, arrowdown: step,
      home: name === 'wall' ? span : -span,
      end: name === 'wall' ? -span : span,
    }[key];
    if (delta !== undefined) {
      event.preventDefault();
      edit(() => moveRoomControl(name, state, delta, 1));
    }
    return;
  }
  if (!selected) return;
  if (key === 'r') rotateSelected();
  if (key === 'f') flipSelected();
  const delta = { arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1] }[key];
  if (delta && !event.target.closest('button')) {
    event.preventDefault();
    edit(() => {
      const step = event.shiftKey ? 1 : 10;
      state.poses[selected].x += delta[0] * step;
      state.poses[selected].y += delta[1] * step;
    });
  }
});

byId('select-mode').onclick = () => setMode('select');
byId('measure-mode').onclick = () => setMode('measure');
byId('create-mode').onclick = () => setMode(mode === 'create' ? 'select' : 'create');
byId('cancel-create').onclick = () => { setMode('select'); byId('create-mode').focus(); };
byId('delete-custom').onclick = deleteCustomFurniture;
byId('create-kind').onchange = () => {
  const preset = deskPresets.has(byId('create-kind').value);
  byId('create-width-field').hidden = byId('create-height-field').hidden = preset;
  drawCreationPreview(null);
  draw();
};
byId('rename-form').onsubmit = event => {
  event.preventDefault();
  if (gesture || !selected) return;
  const input = byId('furniture-name');
  const item = items.get(selected);
  const name = cleanName(input.value);
  edit(() => {
    if (name && name !== item.name) state.names[selected] = name;
    else delete state.names[selected];
  });
  input.value = displayedName(item);
};
byId('erase-mode').onclick = () => setMode('erase');
byId('undo').onclick = () => travel(undoStack, redoStack);
byId('redo').onclick = () => travel(redoStack, undoStack);
byId('reset').onclick = () => {
  pendingAnchor = currentAnchor = null;
  edit(() => { state = fresh(); });
  toast(`${planName} 기본 배치로 돌아왔어요.`);
};
byId('rotate').onclick = rotateSelected;
byId('flip').onclick = flipSelected;

function positionFurnitureActions() {
  byId(mobileScreen.matches ? 'mobile-object-actions' : 'desktop-object-actions').append(furnitureActions);
}
mobileScreen.addEventListener('change', positionFurnitureActions);
positionFurnitureActions();

byId('clear-measurements').onclick = () => {
  edit(() => { state.measures = []; });
  byId('erase-mode').focus();
};
byId('zoom-out').onclick = () => zoom(1 / 1.2);
byId('zoom-in').onclick = () => zoom(1.2);
byId('zoom-fit').onclick = () => {
  if (gesture) return;
  view = [...PLAN.viewBox];
  updateView();
};

function exportScene() {
  draw();
  const clone = scene.cloneNode(true);
  const [x, y, w, h] = PLAN.viewBox;
  const content = [...items.keys()].map(id => plotted.get(id).bounds);
  const left = Math.min(x, ...content.map(b => b.minX - 150));
  const top = Math.min(y, ...content.map(b => b.minY - 150));
  const right = Math.max(x + w, ...content.map(b => b.maxX + 150));
  const bottom = Math.max(y + h, ...content.map(b => b.maxY + 150));
  clone.setAttribute('viewBox', [left, top, right - left, bottom - top].join(' '));
  clone.setAttribute('width', `${(right - left) / 10}`);
  clone.setAttribute('height', `${(bottom - top) / 10}`);
  clone.removeAttribute('id');
  clone.querySelector('#room-controls')?.remove();
  clone.querySelector('#creation-preview')?.remove();
  clone.querySelectorAll('.object-outline, .measurement-hit, [data-temporary="true"]').forEach(node => node.remove());
  for (const line of clone.querySelectorAll('[data-measure-index]')) {
    for (const attr of ['data-measure-index', 'tabindex', 'role', 'aria-label']) line.removeAttribute(attr);
    line.classList.remove('is-erase-target');
  }
  for (const node of clone.querySelectorAll('[data-item]')) {
    for (const attr of ['class', 'data-item', 'tabindex', 'role', 'aria-pressed']) node.removeAttribute(attr);
  }
  return clone;
}

async function exportPng() {
  const button = byId('export-png');
  button.disabled = true;
  let svgUrl;
  try {
    const clone = exportScene();
    const width = clone.width.baseVal.value;
    const height = clone.height.baseVal.value;
    // Keep the full plan within mobile canvas limits, even with furniture outside it.
    const scale = Math.min(3, 4096 / Math.max(width, height));
    const canvas = el('canvas');
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);
    clone.setAttribute('width', canvas.width);
    clone.setAttribute('height', canvas.height);

    const svg = new XMLSerializer().serializeToString(clone);
    svgUrl = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
    const image = new Image();
    image.src = svgUrl;
    await image.decode();

    const context = canvas.getContext('2d');
    context.fillStyle = '#fff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0);
    const png = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!png) throw new Error('Could not encode PNG.');

    const link = el('a');
    link.href = URL.createObjectURL(png);
    link.download = planNumber ? `KESS-2F-layout-plan-${planNumber}.png` : `KESS-${floorNumber}F-layout.png`;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 30000);
  } catch {
    toast('PNG 저장에 실패했어요. 다시 시도해 주세요.');
  } finally {
    if (svgUrl) URL.revokeObjectURL(svgUrl);
    button.disabled = false;
  }
}

function preparePrint() { byId('print-sheet').replaceChildren(exportScene()); }
byId('export-png').onclick = exportPng;
byId('export-pdf').onclick = () => {
  toast('인쇄 창에서 ‘PDF로 저장’을 선택하세요.');
  preparePrint();
  window.print();
};
window.addEventListener('beforeprint', preparePrint);
window.addEventListener('afterprint', () => byId('print-sheet').replaceChildren());

const copyLink = byId('copy-link');
copyLink.hidden = !['http:', 'https:'].includes(location.protocol);
copyLink.onclick = async () => {
  const link = new URL(location.pathname, location.origin);
  if (floorNumber !== 2) link.searchParams.set('floor', floorNumber);
  else if (planNumber === 2) link.searchParams.set('plan', '2');
  link.searchParams.set('start', 'base');
  try {
    await navigator.clipboard.writeText(link.href);
    toast('기본 배치 링크를 복사했어요.');
  } catch {
    window.prompt('기본 배치 링크를 복사하세요.', link.href);
  }
};

for (const [floor, button] of floorButtons) button.onclick = () => switchLayout(floor, lastSecondFloorPlan);
byId('plan-one-link').onclick = () => switchLayout(2, 1);
byId('plan-two-link').onclick = () => switchLayout(2, 2);

const requestedFloor = Number(openingUrl.searchParams.get('floor'));
const initialFloor = Object.hasOwn(UPPER_FLOORS, requestedFloor) ? requestedFloor : 2;
const initialPlan = openingUrl.searchParams.get('plan') === '2' ? 2 : 1;
const openBase = openingUrl.searchParams.get('start') === 'base';
if (openBase) {
  openingUrl.searchParams.delete('start');
  try { history.replaceState(null, '', openingUrl); } catch { /* URL history may be unavailable in a preview. */ }
}
switchLayout(initialFloor, initialPlan, openBase);
</script>
