<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="KESS 2층 가구 배치를 편집하고 간격을 재는 도구">
  <title>KESS 2층 배치 편집기</title>
  <style>:root {
  color-scheme: light;
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  background: #edf1f6;
  color: #192b42;
  --ink: #192b42;
  --muted: #536378;
  --line: #dce4ee;
  --blue: #285da4;
  --blue-soft: #e8f0ff;
  --green: #387b49;
  --danger: #a32d30;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
button, output { font: inherit; }
button {
  min-height: 40px;
  padding: 8px 13px;
  border: 1px solid #d7e0ea;
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  font-size: 14px;
  font-weight: 650;
  white-space: nowrap;
  cursor: pointer;
}
button:hover:not(:disabled) { background: #f0f5fe; border-color: #b1c6e3; }
button:focus-visible { outline: 2px solid #1f66be; outline-offset: 2px; }
button:disabled { color: #697987; opacity: .55; cursor: default; }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
button.primary:hover:not(:disabled) { background: #1c4d90; border-color: #1c4d90; }

.topbar {
  min-height: 86px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px 24px;
  padding: 16px clamp(14px, 2.7vw, 42px);
  color: #fff;
  background: #172f50;
  border-bottom: 3px solid #4574ac;
}
.identity, .file-actions, .toolbar, .history, .segmented, .panel-header, .object-actions, .zoom {
  display: flex;
  align-items: center;
}
.identity { gap: 14px; }
.brand {
  display: grid;
  place-items: center;
  width: 61px;
  height: 46px;
  border: 1px solid #7596bd;
  border-radius: 10px;
  color: #f3f7ff;
  font-family: system-ui, sans-serif;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: .05em;
  background: #254976;
}
h1 { margin: 0; font-size: clamp(20px, 2.2vw, 28px); font-weight: 750; letter-spacing: -.045em; }
.save-status { margin: 5px 0 0; color: #d7e5f8; font-size: 14px; }
.file-actions { gap: 8px; flex-wrap: wrap; }
.file-actions button:not(.primary) { background: #224065; border-color: #6c8bb2; color: #fff; }
.file-actions button:not(.primary):hover { background: #2c507d; }
.file-actions .primary { background: #fff; border-color: #fff; color: #174476; }
.file-actions .primary:hover:not(:disabled) { background: #e5f0ff; border-color: #e5f0ff; }

.workspace {
  max-width: 1650px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 312px;
  gap: 16px;
  margin: 0 auto;
  padding: 16px clamp(12px, 2.5vw, 36px) 20px;
}
.board, .panel { background: white; border: 1px solid var(--line); border-radius: 13px; }
.board { min-width: 0; overflow: hidden; }
.toolbar { min-height: 62px; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.segmented { gap: 4px; background: #edf2f8; border-radius: 9px; padding: 4px; }
.segmented button { border: 0; min-height: 34px; padding: 5px 11px; background: transparent; color: var(--muted); }
.segmented button[aria-pressed="true"] { color: #204e8b; background: #fff; box-shadow: 0 1px 3px #193c6825; }
#erase-mode { display: inline-flex; align-items: center; gap: 6px; }
.eraser-icon { width: 13px; height: 9px; border: 1.5px solid currentColor; border-radius: 2px; transform: rotate(-40deg); background: linear-gradient(90deg, transparent 47%, currentColor 47%, currentColor 56%, transparent 56%); }
.history { gap: 6px; flex-wrap: wrap; }
.history button { min-height: 35px; }
.history #undo, .history #redo { min-width: 38px; padding: 1px 7px; font-size: 21px; line-height: 1; }
.viewport {
  position: relative;
  height: clamp(490px, calc(100dvh - 213px), 1050px);
  overflow: hidden;
  background-color: #e9eff5;
  background-image: radial-gradient(#b7c8d8 1px, transparent 1px);
  background-size: 15px 15px;
  overscroll-behavior: contain;
}
#scene { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
#scene .furniture { cursor: grab; }
#scene .furniture:focus { outline: none; }
#scene .furniture:focus-visible > .object-outline { stroke: #365dcb; stroke-width: 30; stroke-dasharray: 45 24; }
.viewport[data-mode="measure"] #scene, .viewport[data-mode="measure"] #scene * { cursor: crosshair; }
.viewport[data-mode="erase"] #scene { cursor: crosshair; }
.viewport[data-mode="erase"] #scene .furniture { cursor: inherit; }
.viewport[data-mode="erase"] .measurement-hit { pointer-events: stroke; cursor: pointer; }
.viewport[data-mode="erase"] .measurement-label { pointer-events: all; cursor: pointer; }
.viewport[data-mode="erase"] .measurement-line:focus { outline: none; }
.viewport[data-mode="erase"] .measurement-line:is(.is-erase-target, :focus-visible) :is(.measurement-stroke, .measurement-end) { stroke: #ba3737; }
.viewport[data-mode="erase"] .measurement-line:is(.is-erase-target, :focus-visible) .measurement-label { fill: #ba3737; }
.viewport.is-dragging #scene, .viewport.is-dragging #scene * { cursor: grabbing; }
.object-outline { fill: none; stroke: transparent; stroke-width: 25; stroke-linejoin: round; pointer-events: none; }
.furniture.is-selected > .object-outline { stroke: #145dba; stroke-width: 32; }
.furniture.has-collision > .object-outline { stroke: #be3e3b; stroke-width: 29; stroke-dasharray: 65 34; }
.zoom { position: absolute; right: 13px; bottom: 12px; gap: 3px; padding: 4px; background: white; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 3px 12px #203d571c; }
.zoom button { border: 0; padding: 4px 8px; min-width: 34px; min-height: 33px; }
.zoom output { min-width: 51px; text-align: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.board-footer { min-height: 43px; display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 13px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.board-footer > :last-child { white-space: nowrap; }

.inspector { display: flex; flex-direction: column; min-width: 0; gap: 12px; }
.panel { padding: 15px; min-width: 0; }
.panel-header { justify-content: space-between; gap: 9px; margin-bottom: 10px; }
h2, h3, p { margin: 0; }
h2 { font-size: 16px; font-weight: 750; letter-spacing: -.035em; }
h3 { margin-top: 14px; color: var(--muted); font-size: 14px; }
.empty { font-size: 14px; line-height: 1.6; color: var(--muted); }
.selected-name { font-weight: 750; font-size: 18px; letter-spacing: -.025em; word-break: keep-all; }
.selected-size { margin: 5px 0 10px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.object-actions { gap: 7px; }
.object-actions button { flex: 1; }
#mobile-object-actions, .mobile-selection { display: none; }
.collision-status { background: #fff0ed; color: var(--danger); border: 1px solid #f0c8c2; border-radius: 7px; padding: 8px; margin: 10px 0 0; font-size: 14px; line-height: 1.45; }
.readouts { list-style: none; padding: 0; margin: 4px 0 0; }
.readouts li { display: flex; justify-content: space-between; align-items: center; gap: 7px; padding: 7px 0; border-bottom: 1px solid #edf2f6; font-size: 14px; }
.readouts li:last-child { border-bottom: 0; padding-bottom: 0; }
.readouts li span:first-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.readouts strong { white-space: nowrap; font-weight: 730; font-variant-numeric: tabular-nums; }
.readouts li.overlap strong { color: var(--danger); }
.gap-toggle { min-height: 26px; padding: 2px 5px; font-size: 13px; color: #235390; }
.count { min-width: 27px; padding: 3px 6px; border-radius: 5px; background: #edf3fb; color: #35587d; font-size: 14px; text-align: center; }
.swatch { width: 13px; height: 13px; flex: 0 0 13px; border-radius: 4px; background: var(--item-color, #71839b); }
.furniture-list { display: grid; max-height: max(230px, calc(100dvh - 465px)); overflow: auto; gap: 4px; scrollbar-gutter: stable; padding: 2px 4px 2px 2px; }
.furniture-list button { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 38px; background: #f6f8fb; border: 1px solid transparent; text-align: left; white-space: normal; padding: 6px 8px; }
.furniture-list button[aria-pressed="true"] { color: #154883; background: var(--blue-soft); border-color: #9fbce6; }
.furniture-list button.has-collision { border-color: #d38784; }
.toast { position: fixed; z-index: 5; bottom: 20px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 24px); width: max-content; padding: 12px 16px; border-radius: 9px; background: #172f50; color: white; font-size: 15px; box-shadow: 0 6px 24px #172f5045; }
#print-sheet { display: none; }

@media (max-width: 880px) {
  .workspace { grid-template-columns: minmax(0, 1fr) 262px; gap: 10px; }
  .panel { padding: 12px; }
}
@media (max-width: 690px) {
  .workspace { display: block; padding-top: 10px; }
  .board { overflow: clip; }
  .topbar { flex-wrap: wrap; padding-block: 11px; }
  .identity { gap: 9px; }
  .brand { width: 51px; height: 40px; font-size: 14px; }
  .file-actions { gap: 5px; }
  .file-actions button { font-size: 14px; padding-inline: 9px; min-height: 36px; }
  .viewport { height: min(65dvh, 660px); min-height: 385px; }
  .toolbar { padding-inline: 7px; }
  #mobile-object-actions { display: block; position: sticky; top: 0; z-index: 2; background: #f5f8fc; border-bottom: 1px solid var(--line); }
  #mobile-object-actions .object-actions { min-height: 54px; gap: 6px; padding: 5px 8px; }
  #mobile-object-actions button { flex: none; min-height: 44px; padding-inline: 8px; }
  .mobile-selection { display: block; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
  .history { gap: 4px; }
  .history button { padding-inline: 6px; }
  .board-footer { font-size: 13px; }
  .inspector { margin-top: 10px; }
  .furniture-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@page { size: A4 portrait; margin: 8mm; }
@media print {
  html, body { margin: 0; background: white; }
  .topbar, .workspace, .toast { display: none !important; }
  #print-sheet { display: grid !important; width: 100%; min-height: 0; place-items: center; break-inside: avoid; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  #print-sheet svg { display: block; width: 100%; max-height: 277mm; }
}
</style>
</head>

  const subtract = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const cross = (a, b) => a[0] * b[1] - a[1] * b[0];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const distance = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const mix = (a, b, ratio) => [a[0] + (b[0] - a[0]) * ratio, a[1] + (b[1] - a[1]) * ratio];
  const polygonEdges = outline => outline.map((point, index) => [point, outline[(index + 1) % outline.length]]);

  function project(point, a, b) {
    const delta = subtract(b, a);
    const lengthSquared = dot(delta, delta);
    const ratio = lengthSquared ? Math.max(0, Math.min(1, dot(subtract(point, a), delta) / lengthSquared)) : 0;
    const result = mix(a, b, ratio);
    return { point: result, ratio, distance: distance(point, result) };
  }

  function intersection(a, b, c, d, proper = false) {
    const ab = subtract(b, a);
    const cd = subtract(d, c);
    const divisor = cross(ab, cd);
    if (Math.abs(divisor) < epsilon) return null;
    const offset = subtract(c, a);
    const t = cross(offset, cd) / divisor;
    const u = cross(offset, ab) / divisor;
    const minimum = proper ? epsilon : -epsilon;
    const maximum = proper ? 1 - epsilon : 1 + epsilon;
    return t >= minimum && t <= maximum && u >= minimum && u <= maximum ? mix(a, b, t) : null;
  }

  function closestEdges(left, right) {
    let best = { distance: Infinity, a: null, b: null };
    for (const [a, b] of left) {
      for (const [c, d] of right) {
        const crossing = intersection(a, b, c, d);
        if (crossing) return { distance: 0, a: crossing, b: crossing };
        for (const endpoint of [a, b]) {
          const p = project(endpoint, c, d);
          if (p.distance < best.distance) best = { distance: p.distance, a: endpoint, b: p.point };
        }
        for (const endpoint of [c, d]) {
          const p = project(endpoint, a, b);
          if (p.distance < best.distance) best = { distance: p.distance, a: p.point, b: endpoint };
        }
      }
    }
    return best;
  }

  function location(point, polygon, edges = polygonEdges(polygon)) {
    let inside = false;
    for (const [a, b] of edges) {
      if (project(point, a, b).distance < epsilon) return 0;
      if ((a[1] > point[1]) !== (b[1] > point[1])) {
        const x = a[0] + ((b[0] - a[0]) * (point[1] - a[1])) / (b[1] - a[1]);
        if (point[0] < x) inside = !inside;
      }
    }
    return inside ? 1 : -1;
  }

  function bounds(points) {
    return {
      minX: Math.min(...points.map(p => p[0])), maxX: Math.max(...points.map(p => p[0])),
      minY: Math.min(...points.map(p => p[1])), maxY: Math.max(...points.map(p => p[1])),
    };
  }

  function boundsOverlap(a, b) {
    return a.minX <= b.maxX && a.maxX >= b.minX && a.minY <= b.maxY && a.maxY >= b.minY;
  }

  function shape(polygon, edges) {
    const segments = edges ?? polygonEdges(polygon);
    return { polygon, edges: segments, bounds: bounds(polygon ?? segments.flat()) };
  }

  function overlap(a, b) {
    if (!boundsOverlap(a.bounds, b.bounds)) return false;
    if (a.edges.some(([p, q]) => b.edges.some(([r, s]) => intersection(p, q, r, s, true)))) return true;
    if (a.polygon && b.polygon) {
      if (a.polygon.some(p => location(p, b.polygon, b.edges) === 1) || b.polygon.some(p => location(p, a.polygon, a.edges) === 1)) return true;
      if (a.edges.some(([p, q]) => location(mix(p, q, .5), b.polygon, b.edges) === 1)
          || b.edges.some(([p, q]) => location(mix(p, q, .5), a.polygon, a.edges) === 1)) return true;
      const sign = Math.sign(a.edges.reduce((area, [p, q]) => area + cross(p, q), 0));
      return a.edges.some(([p, q]) => {
        const vector = subtract(q, p);
        const length = distance(p, q);
        if (length < epsilon) return false;
        const m = mix(p, q, .5);
        const sample = [m[0] - vector[1] * sign * .01 / length, m[1] + vector[0] * sign * .01 / length];

    const object = a.polygon ? a : b;
    return Boolean(object.polygon && wall.edges.some(([p, q]) => [p, q, mix(p, q, .5)].some(point => location(point, object.polygon, object.edges) === 1)));

  function outside(object, floor) {
    return object.polygon.some(p => location(p, floor.polygon, floor.edges) === -1
      && Math.min(...floor.edges.map(([a, b]) => project(p, a, b).distance)) > 1);
  }

  function place(outline, center, pose) {
    const radians = pose.angle * Math.PI / 180;
    const cos = Math.round(Math.cos(radians));
    const sin = Math.round(Math.sin(radians));
    return outline.map(point => {
      const x = (point[0] - center[0]) * (pose.flip ? -1 : 1);
      const y = point[1] - center[1];
      return [pose.x + center[0] + x * cos - y * sin, pose.y + center[1] + x * sin + y * cos];
    });
  }

  return { bounds, closestEdges, distance, mix, outside, overlap, place, project, shape };
})();

  <script>'use strict';

const listButtons = new Map();

  const swatch = el('span', 'swatch');

function save() {

  const [cx, cy] = item.center;

  const sideways = pose.angle % 180 !== 0;
  for (const { element, area, bounds } of item.labels) {

  for (const object of plotted.values()) {
    for (const [edge, [a, b]] of object.edges.entries()) {
      const candidate = Geometry.project(point, a, b);
      if (candidate.distance < closest.distance) closest = { id: object.id, edge, ...candidate };

  const { distance, ...anchor } = closest;
  return anchor;

    currentAnchor = null;
    draw();
    return;

  if (state.measures.length >= 50) {

    return;
  }
  const hit = event.target.closest('[data-item]');
  if (!hit) {
    selectItem(null);
    return;
  }
  const id = hit.getAttribute('data-item');
  const inverse = scene.getScreenCTM().inverse();
  const point = screenPoint(event.clientX, event.clientY, inverse);
  hit.focus({ preventScroll: true });
  selectItem(id);
  gesture = { pointer: event.pointerId, id, point, inverse, startState: copyState(state), moved: false };
  event.preventDefault();
  scene.setPointerCapture(event.pointerId);
});

scene.addEventListener('pointermove', event => {
  if (!gesture) {
    if (mode === 'measure' && pendingAnchor) {
      currentAnchor = snapAnchor(screenPoint(event.clientX, event.clientY));
      drawSoon();
    }
    if (mode === 'erase') {
      const index = measurementAt(screenPoint(event.clientX, event.clientY), event.target);
      for (const line of annotations.querySelectorAll('.measurement-line')) {
        line.classList.toggle('is-erase-target', Number(line.dataset.measureIndex) === index);
      }
    }
    return;
  }
  if (gesture.pointer !== event.pointerId) return;
  const point = screenPoint(event.clientX, event.clientY, gesture.inverse);
  const delta = [point[0] - gesture.point[0], point[1] - gesture.point[1]];
  if (!gesture.moved && Math.hypot(...delta) * Math.abs(scene.getScreenCTM().a) < 3) return;
  gesture.moved = true;
  viewport.classList.add('is-dragging');
  const start = gesture.startState.poses[gesture.id];
  const pose = state.poses[gesture.id];
  const step = event.altKey ? 1 : 10;
  pose.x = Math.round((start.x + delta[0]) / step) * step;
  pose.y = Math.round((start.y + delta[1]) / step) * step;
  drawSoon();
});

function endGesture(event, cancelled = false) {
  if (!gesture || gesture.pointer !== event.pointerId) return;
  const active = gesture;
  gesture = null;
  viewport.classList.remove('is-dragging');
  if (cancelled) {
    state = active.startState;
    draw();
  } else commit(active.startState);
}
scene.addEventListener('pointerleave', () => annotations.querySelector('.is-erase-target')?.classList.remove('is-erase-target'));
scene.addEventListener('pointerup', endGesture);
scene.addEventListener('pointercancel', event => endGesture(event, true));
scene.addEventListener('lostpointercapture', event => endGesture(event, true));

function rotateSelected() {
  if (!selected || gesture) return;
  edit(() => { state.poses[selected].angle = (state.poses[selected].angle + 90) % 360; });
}

function flipSelected() {
  if (!selected || gesture) return;
  edit(() => { state.poses[selected].flip = !state.poses[selected].flip; });
}

document.addEventListener('keydown', event => {
  const key = event.key.toLowerCase();
  if ((event.ctrlKey || event.metaKey) && (key === 'z' || key === 'y')) {
    event.preventDefault();
    if (key === 'y' || event.shiftKey) travel(redoStack, undoStack);
    else travel(undoStack, redoStack);
    return;
  }
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (key === 'escape') {
    if (mode === 'measure') { pendingAnchor = currentAnchor = null; draw(); }
    else if (mode === 'erase') setMode('select');
    else selectItem(null);
  }
  if (key === 'e' && !gesture) setMode(mode === 'erase' ? 'select' : 'erase');
  if (mode !== 'select' || !selected || gesture) return;
  if (key === 'r') rotateSelected();
  if (key === 'f') flipSelected();
  const delta = { arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1] }[key];
  if (delta && !event.target.closest('button')) {
    event.preventDefault();
    edit(() => {
      const step = event.shiftKey ? 1 : 10;
      state.poses[selected].x += delta[0] * step;
      state.poses[selected].y += delta[1] * step;
    });
  }
});

byId('select-mode').onclick = () => setMode('select');
byId('measure-mode').onclick = () => setMode('measure');
byId('erase-mode').onclick = () => setMode('erase');
byId('undo').onclick = () => travel(undoStack, redoStack);
byId('redo').onclick = () => travel(redoStack, undoStack);
byId('reset').onclick = () => {
  pendingAnchor = currentAnchor = null;
  edit(() => { state = fresh(); });
  toast('3안 기본 배치로 돌아왔어요.');
};
byId('rotate').onclick = rotateSelected;
byId('flip').onclick = flipSelected;

function positionFurnitureActions() {
  byId(mobileScreen.matches ? 'mobile-object-actions' : 'desktop-object-actions').append(furnitureActions);
}
mobileScreen.addEventListener('change', positionFurnitureActions);
positionFurnitureActions();

byId('clear-measurements').onclick = () => {
  edit(() => { state.measures = []; });
  byId('erase-mode').focus();
};
byId('zoom-out').onclick = () => zoom(1 / 1.2);
byId('zoom-in').onclick = () => zoom(1.2);
byId('zoom-fit').onclick = () => { view = [...PLAN.viewBox]; updateView(); };

function exportScene() {
  draw();
  const clone = scene.cloneNode(true);
  const [x, y, w, h] = PLAN.viewBox;
  const content = [...items.keys()].map(id => plotted.get(id).bounds);
  const left = Math.min(x, ...content.map(b => b.minX - 150));
  const top = Math.min(y, ...content.map(b => b.minY - 150));
  const right = Math.max(x + w, ...content.map(b => b.maxX + 150));
  const bottom = Math.max(y + h, ...content.map(b => b.maxY + 150));
  clone.setAttribute('viewBox', [left, top, right - left, bottom - top].join(' '));
  clone.setAttribute('width', `${(right - left) / 10}`);
  clone.setAttribute('height', `${(bottom - top) / 10}`);
  clone.removeAttribute('id');
  clone.querySelectorAll('.object-outline, .measurement-hit, [data-temporary="true"]').forEach(node => node.remove());
  for (const line of clone.querySelectorAll('[data-measure-index]')) {
    for (const attr of ['data-measure-index', 'tabindex', 'role', 'aria-label']) line.removeAttribute(attr);
    line.classList.remove('is-erase-target');
  }
  for (const node of clone.querySelectorAll('[data-item]')) {
    for (const attr of ['class', 'data-item', 'tabindex', 'role', 'aria-pressed']) node.removeAttribute(attr);
  }
  return clone;
}

function exportSvg() {
  const text = new XMLSerializer().serializeToString(exportScene());
  const url = URL.createObjectURL(new Blob([text], { type: 'image/svg+xml;charset=utf-8' }));
  const link = el('a');
  link.href = url;
  link.download = 'KESS-2F-layout.svg';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function preparePrint() { byId('print-sheet').replaceChildren(exportScene()); }
byId('export-svg').onclick = exportSvg;
byId('export-pdf').onclick = () => {
  toast('인쇄 창에서 ‘PDF로 저장’을 선택하세요.');
  preparePrint();
  window.print();
};
window.addEventListener('beforeprint', preparePrint);
window.addEventListener('afterprint', () => byId('print-sheet').replaceChildren());

const copyLink = byId('copy-link');
copyLink.hidden = !['http:', 'https:'].includes(location.protocol);
copyLink.onclick = async () => {
  const link = `${location.origin}${location.pathname}?start=base`;
  try {
    await navigator.clipboard.writeText(link);
    toast('기본 배치 링크를 복사했어요.');
  } catch {
    window.prompt('기본 배치 링크를 복사하세요.', link);
  }
};

updateStatus();
draw();
</script>
</body>
